[workspace]
members = ["crates/context-core", "crates/context-workflows", "crates/context-storage", "crates/context-auth", "crates/context-engine"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/thomasquintana/context-mcp"

[workspace.dependencies]
context-core = { version = "=0.1.0", path = "crates/context-core" }
context-storage = { path = "crates/context-storage" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
actix = "=0.13.5"
htlk = { version = "=0.1.0", git = "https://github.com/thomasquintana/htlk.git", rev = "3448acb5dc7cebef4d08ef37bb79757fea780659" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
sha2 = "=0.10.9"
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "stream", "form"] }
bytes = "1"
futures-util = "0.3"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
secrecy = "0.10"
getrandom = "0.4"
base64 = "0.23"
quick-xml = { version = "=0.41.0", features = ["serialize"] }

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "context-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "HTLK-orchestrated multimodal context and semantic memory MCP server"
publish = false
readme = "README.md"
exclude = [".opencode/", "AGENTS.md"]

[dependencies]
context-core.workspace = true
context-engine = { path = "crates/context-engine" }
context-auth = { path = "crates/context-auth" }
context-storage.workspace = true
context-workflows = { path = "crates/context-workflows" }
actix.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
uuid.workspace = true
clap = { version = "4", features = ["derive"] }
axum = "0.8"
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.6", features = ["cors", "timeout"] }
url = "=2.5.8"

[dev-dependencies]
tempfile = "3"
reqwest.workspace = true
sqlx.workspace = true
htlk.workspace = true

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
