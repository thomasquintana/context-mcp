[workspace]
members = ["crates/context-core", "crates/context-workflows", "crates/context-storage"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/thomasquintana/context-mcp"

[workspace.dependencies]
context-core = { version = "=0.1.0", path = "crates/context-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }
actix = "=0.13.5"
htlk = { version = "=0.1.0", git = "https://github.com/thomasquintana/htlk.git", rev = "3448acb5dc7cebef4d08ef37bb79757fea780659" }
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "postgres", "uuid", "json", "migrate", "macros"] }
tokio = { version = "=1.53.3", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time", "signal"] }
sha2 = "=0.10.9"

[workspace.lints.rust]
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_lifetimes = "warn"
unused_qualifications = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[package]
name = "context-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Provider-neutral multimodal context and semantic memory contracts for HTLK"
readme = "README.md"
exclude = [".opencode/", "AGENTS.md"]

[dependencies]
context-core.workspace = true

[lints]
workspace = true

[profile.release]
codegen-units = 1
lto = "thin"
